<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistente Nexo</title>
  <meta name="description" content="Assistente interno da Nexo Seguros com respostas citando a base de conhecimento." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230B4F5C'/%3E%3Cpath d='M12 28V12l16 16V12' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='12' r='3.2' fill='%23FF6F59'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0E6273" />
              <stop offset="1" stop-color="#073A45" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#lg)" />
          <path d="M12 28V12l16 16V12" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="28" cy="12" r="3.4" fill="#FF6F59" />
        </svg>
        <div class="brand-text">
          <div class="brand-name">Assistente Nexo</div>
          <div class="brand-sub">base de conhecimento interna · Nexo Seguros</div>
        </div>
      </div>
      <div class="topbar-right">
        <span id="mockBadge" class="badge badge-mock" hidden>modo demo</span>
        <button id="apiStatus" class="status" type="button" title="Status da API">
          <span class="dot"></span><span class="status-text">verificando…</span>
        </button>
        <button id="newChat" class="icon-btn" type="button" title="Nova conversa" aria-label="Nova conversa">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <div class="welcome-mark">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="11" fill="url(#lg)" />
            <path d="M12 28V12l16 16V12" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="28" cy="12" r="3.4" fill="#FF6F59" />
          </svg>
        </div>
        <h1>Como posso ajudar hoje?</h1>
        <p class="welcome-sub">Pergunte sobre políticas, benefícios, sinistros, TI ou compliance.<br />
          Toda resposta vem com as <strong>fontes internas</strong> citadas.</p>
        <div class="suggestions" id="suggestions">
          <button class="chip" type="button"><span class="chip-ic">🚗</span>Qual o prazo para avisar sinistro de auto?</button>
          <button class="chip" type="button"><span class="chip-ic">🔑</span>Quantos dias de carro reserva no plano Plus?</button>
          <button class="chip" type="button"><span class="chip-ic">🏠</span>Como funciona o home office?</button>
          <button class="chip" type="button"><span class="chip-ic">🛡️</span>Posso usar o ChatGPT com dados de clientes?</button>
        </div>
      </section>
      <div id="messages" class="messages"></div>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="question" rows="1" maxlength="1000" placeholder="Pergunte algo à base de conhecimento da Nexo…" aria-label="Sua pergunta"></textarea>
        <button id="send" class="send" type="submit" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="disclaimer">Respostas geradas a partir de documentos internos. Confira sempre as fontes citadas.</p>
    </footer>
  </div>

  <div id="popover" class="popover" role="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
